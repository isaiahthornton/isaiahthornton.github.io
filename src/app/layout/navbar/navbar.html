<header class="nav">
  <div class="container nav-inner">
    <a routerLink="/" class="brand" aria-label="Isaiah Thornton, home">
      <span class="mark" aria-hidden="true">IT</span>
      <span class="brand-name">Isaiah Thornton</span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-nav"
      (click)="toggleMenu()"
    >
      <span class="sr-only">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
      <span class="bar" [class.open]="menuOpen()" aria-hidden="true"></span>
    </button>

    <nav id="primary-nav" [class.open]="menuOpen()" aria-label="Primary">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          ariaCurrentWhenActive="page"
          >{{ link.label }}</a
        >
      }
    </nav>
  </div>
</header>
